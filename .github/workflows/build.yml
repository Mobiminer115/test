name: Build CW3 Unit Editor

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      THEOS: ${{ github.workspace }}/theos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Clone Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

      - name: Install patched iOS SDK via Git
        shell: bash
        run: |
          set -euo pipefail
          SDK_REPO="$RUNNER_TEMP/theos-sdks"
          git clone --depth 1 https://github.com/theos/sdks.git "$SDK_REPO"
          test -d "$SDK_REPO/iPhoneOS16.5.sdk"
          ditto "$SDK_REPO/iPhoneOS16.5.sdk" "$THEOS/sdks/iPhoneOS16.5.sdk"
          test -f "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/Frameworks/UIKit.framework/Headers/UIView.h"

      - name: Build ARM64 dylib
        shell: bash
        run: |
          set -euo pipefail
          make clean
          make FINALPACKAGE=1
          DYLIB="$(find .theos -type f -name 'CW3UnitEditor.dylib' -print -quit)"
          if [[ -z "$DYLIB" ]]; then
            echo "CW3UnitEditor.dylib was not produced"
            find .theos -maxdepth 6 -type f -print || true
            exit 1
          fi
          mkdir -p dist
          cp "$DYLIB" dist/CW3UnitEditor-arm64.dylib
          file dist/CW3UnitEditor-arm64.dylib
          xcrun lipo -verify_arch arm64 dist/CW3UnitEditor-arm64.dylib

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: CW3UnitEditor-arm64
          path: dist/CW3UnitEditor-arm64.dylib
          if-no-files-found: error
          retention-days: 14
